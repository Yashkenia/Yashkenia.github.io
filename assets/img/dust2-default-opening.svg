<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Dust2 T pistol default opening">
  <rect width="960" height="640" fill="#0d0d0d"/>
  <text x="32" y="42" fill="#f5c518" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">Dust2 T Pistol — Default Opening (0–15s)</text>
  <text x="32" y="68" fill="#9a9a9a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Xbox smoke · short pressure · long hold · P250 contact</text>
  <!-- Map bones -->
  <g stroke="#2a2a2a" stroke-width="2" fill="#161616">
    <rect x="80" y="120" width="200" height="140" rx="6"/>
    <rect x="280" y="160" width="160" height="80" rx="4"/>
    <rect x="440" y="140" width="180" height="120" rx="6"/>
    <rect x="620" y="120" width="220" height="160" rx="6"/>
    <rect x="200" y="300" width="120" height="180" rx="4"/>
    <rect x="340" y="320" width="200" height="100" rx="4"/>
    <rect x="560" y="300" width="140" height="200" rx="4"/>
    <rect x="720" y="320" width="140" height="160" rx="6"/>
  </g>
  <text x="150" y="200" fill="#6a6a6a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" text-anchor="middle">LONG A</text>
  <text x="530" y="205" fill="#6a6a6a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" text-anchor="middle">MID / XBOX</text>
  <text x="730" y="200" fill="#6a6a6a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" text-anchor="middle">SHORT / CAT</text>
  <text x="260" y="400" fill="#6a6a6a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-anchor="middle">TUNNELS</text>
  <text x="440" y="375" fill="#6a6a6a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-anchor="middle">LOWER</text>
  <text x="790" y="400" fill="#6a6a6a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" text-anchor="middle">B SITE</text>
  <!-- Xbox smoke -->
  <circle cx="500" cy="210" r="42" fill="#f5c518" fill-opacity="0.18" stroke="#f5c518" stroke-width="2"/>
  <text x="500" y="215" fill="#f5c518" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">XBOX</text>
  <text x="500" y="232" fill="#f5c518" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" text-anchor="middle">SMOKE</text>
  <!-- Players -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600">
    <circle cx="700" cy="250" r="14" fill="#f5c518"/><text x="700" y="254" fill="#0d0d0d" text-anchor="middle">P250</text>
    <text x="700" y="278" fill="#e8e8e8" text-anchor="middle">Contact short</text>
    <circle cx="760" cy="250" r="14" fill="#c9a227"/><text x="760" y="254" fill="#0d0d0d" text-anchor="middle">2</text>
    <text x="760" y="278" fill="#e8e8e8" text-anchor="middle">Trade short</text>
    <circle cx="160" cy="280" r="14" fill="#888"/><text x="160" y="284" fill="#0d0d0d" text-anchor="middle">L</text>
    <text x="160" y="308" fill="#e8e8e8" text-anchor="middle">Long hold</text>
    <circle cx="440" cy="280" r="14" fill="#888"/><text x="440" y="284" fill="#0d0d0d" text-anchor="middle">M</text>
    <text x="440" y="308" fill="#e8e8e8" text-anchor="middle">Mid / IGL</text>
    <circle cx="300" cy="420" r="14" fill="#666"/><text x="300" y="424" fill="#e8e8e8" text-anchor="middle">5</text>
    <text x="300" y="448" fill="#e8e8e8" text-anchor="middle">Lurk / tunnels</text>
  </g>
  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f5c518"/></marker>
  </defs>
  <path d="M480 250 L650 250" stroke="#f5c518" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
  <text x="32" y="560" fill="#9a9a9a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Call: “Xbox smoke, two short.” Contact takes the fight. IGL branches before the smoke fades.</text>
  <text x="32" y="590" fill="#5a5a5a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">VaporX · tactical diagram · illustrative, not to scale</text>
</svg>
