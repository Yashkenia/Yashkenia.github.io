<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Stick-figure flowchart of the GNU Radio replay flowgraph</title>
  <desc id="desc">The replay flowgraph reads the saved signal from a File Source, paces it with a Throttle block, and transmits it through an Osmocom Sink driving the HackRF. The burst goes out on the air and the car unlocks.</desc>
  <rect width="900" height="300" fill="#fffef8"/>
  <text x="450" y="32" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="22" fill="#222">step 2: replay it (transmit mode) = capture in reverse</text>

  <!-- file source -->
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="40" y="110" width="34" height="34" rx="3"/>
    <rect x="46" y="110" width="16" height="12"/>
  </g>
  <rect x="86" y="104" width="130" height="48" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="151" y="124" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">File Source</text>
  <text x="151" y="143" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="11" fill="#555">reads saved signal</text>

  <line x1="216" y1="128" x2="266" y2="128" stroke="#222" stroke-width="2"/>
  <polygon points="266,122 278,128 266,134" fill="#222"/>

  <!-- throttle -->
  <rect x="284" y="104" width="130" height="48" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="349" y="124" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">Throttle</text>
  <text x="349" y="143" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="11" fill="#555">steady, repeated rate</text>

  <line x1="414" y1="128" x2="464" y2="128" stroke="#222" stroke-width="2"/>
  <polygon points="464,122 476,128 464,134" fill="#222"/>

  <!-- osmocom sink -->
  <rect x="482" y="104" width="150" height="48" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="557" y="124" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">Osmocom Sink</text>
  <text x="557" y="143" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="11" fill="#555">= HackRF, transmitting</text>

  <!-- waves out -->
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M644 118 q14 -12 28 0"/>
    <path d="M644 126 q20 -18 40 0"/>
  </g>
  <text x="700" y="100" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="12" fill="#222">code "A"</text>

  <!-- car -->
  <g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M712 150 h66 l13 -20 h32 l15 20 h10"/>
    <line x1="712" y1="150" x2="848" y2="150"/>
    <circle cx="738" cy="150" r="9"/>
    <circle cx="820" cy="150" r="9"/>
  </g>
  <text x="782" y="184" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">car unlocks</text>

  <text x="450" y="236" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="14" fill="#222">no cloning, no cracking — just record and re-send</text>
</svg>
