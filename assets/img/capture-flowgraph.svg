<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Stick-figure flowchart of the GNU Radio capture flowgraph</title>
  <desc id="desc">Pressing the fob sends a radio burst at about 433.9 MHz. The HackRF, driven by an Osmocom Source block, receives it. The signal then splits two ways: a Waterfall Sink shows a bright peak on screen, and a File Sink writes the raw signal to disk.</desc>
  <rect width="900" height="360" fill="#fffef8"/>
  <text x="450" y="32" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="22" fill="#222">step 1: capture the key (receive mode)</text>

  <!-- person + fob -->
  <g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="55" cy="130" r="15"/>
    <line x1="55" y1="145" x2="55" y2="183"/>
    <line x1="55" y1="157" x2="37" y2="172"/>
    <line x1="55" y1="157" x2="80" y2="148"/>
    <line x1="55" y1="183" x2="41" y2="210"/>
    <line x1="55" y1="183" x2="69" y2="210"/>
    <rect x="84" y="138" width="28" height="18"/>
  </g>
  <text x="98" y="151" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="10" fill="#222">fob</text>
  <text x="60" y="232" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="12" fill="#222">press button</text>

  <!-- waves + freq label -->
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M130 140 q14 -12 28 0"/>
    <path d="M130 148 q20 -18 40 0"/>
  </g>
  <text x="200" y="120" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">~433.9 MHz</text>
  <line x1="178" y1="148" x2="238" y2="148" stroke="#222" stroke-width="2"/>
  <polygon points="238,142 250,148 238,154" fill="#222"/>

  <!-- osmocom source block -->
  <rect x="256" y="122" width="150" height="56" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="331" y="146" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">Osmocom Source</text>
  <text x="331" y="166" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="12" fill="#222">= HackRF, listening</text>
  <text x="331" y="200" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="11" fill="#555">sample rate 2 MHz</text>

  <!-- split arrow -->
  <line x1="406" y1="150" x2="470" y2="150" stroke="#222" stroke-width="2"/>
  <line x1="470" y1="150" x2="470" y2="90" stroke="#222" stroke-width="2"/>
  <line x1="470" y1="150" x2="470" y2="250" stroke="#222" stroke-width="2"/>
  <line x1="470" y1="90" x2="560" y2="90" stroke="#222" stroke-width="2"/>
  <polygon points="560,84 572,90 560,96" fill="#222"/>
  <line x1="470" y1="250" x2="560" y2="250" stroke="#222" stroke-width="2"/>
  <polygon points="560,244 572,250 560,256" fill="#222"/>

  <!-- waterfall sink -->
  <rect x="578" y="62" width="160" height="58" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="658" y="86" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">Waterfall Sink</text>
  <text x="658" y="106" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="12" fill="#222">peak jumps on screen</text>
  <!-- little peak -->
  <polyline points="756,112 770,112 778,78 786,112 800,112" fill="none" stroke="#b00" stroke-width="2"/>

  <!-- file sink -->
  <rect x="578" y="222" width="160" height="58" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="658" y="246" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="13" fill="#222">File Sink</text>
  <text x="658" y="266" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="12" fill="#222">saves signal to disk</text>
  <!-- disk -->
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="760" y="232" width="34" height="34" rx="3"/>
    <rect x="766" y="232" width="16" height="12"/>
  </g>
  <text x="658" y="316" text-anchor="middle" font-family="Comic Sans MS, Comic Sans, cursive" font-size="12" fill="#555">(kept for the replay step)</text>
</svg>
