<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">&gt;_</span>
      <span class="brand-name">{{ site.brand | default: site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a class="nav-icon" href="https://x.com/{{ site.x_username }}" target="_blank" rel="me noopener" aria-label="X (@{{ site.x_username }})">{% include icons.html name="x" %}</a>
      <a class="nav-icon" href="https://github.com/{{ site.github_username }}" target="_blank" rel="me noopener" aria-label="GitHub ({{ site.github_username }})">{% include icons.html name="github" %}</a>
    </nav>
  </div>
</header>
