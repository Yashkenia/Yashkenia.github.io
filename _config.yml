# Site settings
title: "VaporX"
brand: "VaporX"
description: "Exploit dev, AI bots, and Counter-Strike. Learning in public."
author: VaporX
url: "https://vaporx.dev"
baseurl: ""
lang: en
timezone: Asia/Kolkata

# Social (used in nav/footer and SEO)
x_username: VAporXdc
github_username: VAporXdc
logo: /assets/img/mark.svg

twitter:
  username: VAporXdc
  card: summary_large_image
social:
  name: VaporX
  links:
    - https://x.com/VAporXdc
    - https://github.com/VAporXdc

# Build (works with GitHub Pages' built-in Jekyll build, no Actions needed)
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:year/:month/:day/:title/
words_per_minute: 200

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      image: /assets/img/og-default.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
